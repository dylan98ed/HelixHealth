services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-helixhealth_db}
      POSTGRES_USER: ${DB_USER:-helixhealth_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
    environment:
      DJANGO_ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-helixhealth_db}
      DB_USER: ${DB_USER:-helixhealth_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
