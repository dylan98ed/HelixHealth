services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-helixhealth_db}
      POSTGRES_USER: ${DB_USER:-helixhealth_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
    environment: &app_environment
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-helixhealth_db}
      DB_USER: ${DB_USER:-helixhealth_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "manage.py", "send_appointment_reminders", "--watch"]
    restart: unless-stopped
    environment:
      <<: *app_environment
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-60}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-appointments@helixhealth.local}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
