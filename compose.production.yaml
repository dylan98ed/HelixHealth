services:
  web:
    environment:
      DJANGO_ENVIRONMENT: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY for production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS for production}
      INTEROPERABILITY_BASE_URI: ${INTEROPERABILITY_BASE_URI:?Set INTEROPERABILITY_BASE_URI for production}
      INTEROPERABILITY_INSTITUTION_SYSTEM: ${INTEROPERABILITY_INSTITUTION_SYSTEM:?Set INTEROPERABILITY_INSTITUTION_SYSTEM for production}
      INTEROPERABILITY_INSTITUTION_CODE: ${INTEROPERABILITY_INSTITUTION_CODE:?Set INTEROPERABILITY_INSTITUTION_CODE for production}
      INTEROPERABILITY_INSTITUTION_NAME: ${INTEROPERABILITY_INSTITUTION_NAME:?Set INTEROPERABILITY_INSTITUTION_NAME for production}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-false}
    volumes: !reset []
    command: !reset null
