{% load django_htmx static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HelixHealth{% endblock %}</title>
    <link
      href="{% static 'vendor/bootstrap/5.3.8/bootstrap.min.css' %}"
      rel="stylesheet"
    >
    {% block extra_head %}{% endblock %}
  </head>
  <body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}' class="bg-body-tertiary">
    <header>
      <nav class="navbar bg-primary" data-bs-theme="dark" aria-label="Main navigation">
        <div class="container">
          <a class="navbar-brand fw-semibold" href="{% url 'home' %}">HelixHealth</a>
          {% if user.is_authenticated %}
            <a class="btn btn-sm btn-outline-light" href="{% url 'patients:search' %}">Patient search</a>
          {% endif %}
        </div>
      </nav>
    </header>

    <main class="container py-5" id="main-content">
      {% block content %}{% endblock %}
    </main>

    <script
      src="{% static 'vendor/bootstrap/5.3.8/bootstrap.bundle.min.js' %}"
    ></script>
    {% htmx_script %}
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
