{% extends "base.html" %}

{% block title %}Sign in · HelixHealth{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <section class="card shadow-sm" aria-labelledby="login-heading">
        <div class="card-body p-4">
          <h1 class="h3" id="login-heading">Sign in to HelixHealth</h1>
          {% if form.errors %}
            <div class="alert alert-danger" role="alert">
              Your username or password is incorrect.
            </div>
          {% endif %}
          <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div class="mb-3">
              <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
              {{ form.username }}
            </div>
            <div class="mb-3">
              <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
              {{ form.password }}
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
          </form>
        </div>
      </section>
    </div>
  </div>
{% endblock %}
