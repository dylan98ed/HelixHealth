<form
  method="post"
  action="{% url 'clinical_records:patient-admissions' patient.pk %}"
  hx-post="{% url 'clinical_records:patient-admissions' patient.pk %}"
  hx-target="#admission-workflow"
  hx-swap="outerHTML"
  id="admission-workflow"
  novalidate
>
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
  {% endif %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
      {% if field.errors %}
        <div class="text-danger" data-field-error="{{ field.name }}">
          {{ field.errors }}
        </div>
      {% endif %}
    </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Record admission</button>
</form>
