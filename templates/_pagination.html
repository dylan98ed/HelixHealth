{% if page_obj.has_other_pages %}
  <nav class="mt-4" aria-label="{{ label }} pagination">
    <ul class="pagination">
      <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
        {% if page_obj.has_previous %}
          <a class="page-link" href="?{{ page_parameter }}={{ page_obj.previous_page_number }}{% if query_dni %}&amp;dni={{ query_dni|urlencode }}{% endif %}">Previous</a>
        {% else %}
          <span class="page-link">Previous</span>
        {% endif %}
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
      </li>
      <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
        {% if page_obj.has_next %}
          <a class="page-link" href="?{{ page_parameter }}={{ page_obj.next_page_number }}{% if query_dni %}&amp;dni={{ query_dni|urlencode }}{% endif %}">Next</a>
        {% else %}
          <span class="page-link">Next</span>
        {% endif %}
      </li>
    </ul>
  </nav>
{% endif %}
